<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #16001f, #5b075f, #ff4f81);
  color: white;
  text-align: center;
}

/* COUNTDOWN */
#countdown {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #16001f, #5b075f, #ff4f81);
  z-index: 100;
}

#number {
  font-size: 120px;
  font-weight: bold;
  animation: zoom 1s ease-in-out;
}

@keyframes zoom {
  0% {
    transform: scale(0.2);
    opacity: 0;
  }

  50% {
    transform: scale(1.2);
    opacity: 1;
  }

  100% {
    transform: scale(1);
    opacity: 1;
  }
}

/* MAIN PAGE */

.container {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.card {
  width: 100%;
  max-width: 500px;
  padding: 40px 25px;
  border-radius: 30px;
  background: rgba(255,255,255,0.13);
  backdrop-filter: blur(15px);
  box-shadow: 0 0 40px rgba(255,255,255,0.18);
}

h1 {
  font-size: 42px;
  margin: 10px 0;
}

h2 {
  font-size: 28px;
  margin: 15px 0;
}

p {
  font-size: 18px;
  line-height: 1.6;
}

.cake {
  font-size: 90px;
  animation: bounce 1.5s infinite;
}

.hidden {
  display: none;
}

/* FLOATING HEARTS */

.heart {
  position: fixed;
  bottom: -20px;
  font-size: 25px;
  animation: float 5s linear forwards;
}

@keyframes bounce {
  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-15px);
  }
}

@keyframes float {
  from {
    transform: translateY(0) rotate(0deg);
    opacity: 1;
  }

  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

/* BUTTON */

button {
  border: none;
  padding: 14px 25px;
  border-radius: 30px;
  background: white;
  color: #d4145a;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

</style>
</head>

<body>

<!-- 3 2 1 COUNTDOWN -->

<div id="countdown">
  <div id="number">3</div>
</div>


<!-- BIRTHDAY PAGE -->

<div class="container">

  <div class="card">

    <div id="birthdayContent">

      <div class="cake">🎂</div>

      <h1>🎉 HAPPY BIRTHDAY 🎉</h1>

      <h2>To My Special Person ❤️</h2>

      <p>
        Wishing you a day filled with happiness,
        smiles, love and beautiful memories. 💕
      </p>

      <p>
        May all your dreams come true! ✨
      </p>

      <p>
        🎂 🥳 💖 🎁 🌸
      </p>

      <button onclick="showMessage()">
        Tap for a Surprise 💝
      </button>

      <p id="message" class="hidden">
        You deserve all the happiness in the world! ❤️✨
      </p>

    </div>

  </div>

</div>


<script>

/* 3 → 2 → 1 */

const number = document.getElementById("number");

let count = 3;

const countdownTimer = setInterval(() => {

  count--;

  if (count > 0) {

    number.innerHTML = count;

    /* Restart animation */
    number.style.animation = "none";
    number.offsetHeight;
    number.style.animation = "zoom 1s ease-in-out";

  } else {

    clearInterval(countdownTimer);

    /* Hide countdown */
    document.getElementById("countdown").style.display = "none";

    /* Start hearts */
    createHearts();
  }

}, 1000);


/* SURPRISE BUTTON */

function showMessage() {

  document.getElementById("message")
    .classList.remove("hidden");

}


/* FLOATING HEARTS */

function createHearts() {

  setInterval(() => {

    const heart = document.createElement("div");

    heart.className = "heart";

    const hearts = [
      "❤️",
      "💖",
      "💕",
      "💗",
      "💝",
      "✨"
    ];

    heart.innerHTML =
      hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left =
      Math.random() * 100 + "vw";

    heart.style.animationDuration =
      (3 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 7000);

  }, 500);

}

</script>

</body>
</html>
